name: Publish Deprecated Stub

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Publish to VS Marketplace
        run: npx vsce publish -p "$VSCE_PAT_LEGACY"
        env:
          VSCE_PAT_LEGACY: ${{ secrets.VSCE_PAT_LEGACY }}
