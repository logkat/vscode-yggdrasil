name: Publish Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least privilege: publishing authenticates to the Marketplace and Open VSX with
# their own PATs, so GITHUB_TOKEN only ever needs to read the repo.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - name: Verify lockfile is up to date
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code package-lock.json
      - run: npm run compile
      - name: Run tests (xvfb for VS Code extension host)
        run: xvfb-run -a npm test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "Tag $TAG (version $VERSION) does not match package.json ($PKG)"
            exit 1
          fi

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
