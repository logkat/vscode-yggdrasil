name: Auto Release

# Runs on push to main branch. If the commit is not a release commit (does not contain [skip ci]),
# this workflow runs npm run release to automatically bump version, update changelog,
# commit/tag changes, push back to main, and trigger the Publish Extension workflow.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full history to determine version bump and generate changelogs accurately
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release
        run: npm run release

      - name: Push changes and tags
        run: |
          git push origin main --follow-tags

      - name: Get version tag
        id: tag
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Dispatch publish workflow
        run: gh workflow run publish.yml --ref "${{ steps.tag.outputs.value }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
