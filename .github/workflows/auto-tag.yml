name: Auto Tag

# Runs on every push to main. If the version in package.json doesn't have a
# matching git tag yet, this workflow creates one and then explicitly dispatches
# the Publish workflow at that tag.
#
# Why not rely on the tag push to trigger Publish directly?
# GitHub does not fire workflow events for pushes made by GITHUB_TOKEN to
# prevent infinite loops. workflow_dispatch via the API is explicitly exempted
# from this restriction, so we dispatch Publish ourselves after tagging.
on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to push tags
  actions: write    # needed to dispatch the publish workflow

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full history so we can check existing tags reliably.
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_exists
        run: |
          if git rev-parse --verify "refs/tags/${{ steps.version.outputs.value }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"

      - name: Dispatch publish workflow
        if: steps.tag_exists.outputs.exists == 'false'
        run: gh workflow run publish.yml --ref "${{ steps.version.outputs.value }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
