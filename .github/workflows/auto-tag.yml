name: Auto Release

# Runs on push to main. If the commit is not a release commit (does not contain [skip ci]),
# this workflow runs npm run release to bump the version, update the changelog,
# commit/tag the changes, push back to main, and trigger the Publish Extension workflow.
#
# NOTE: `main` is protected by a ruleset requiring pull requests. A plain GITHUB_TOKEN
# cannot push here — see the "Push changes and tags" step below.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

# Two pushes landing close together would otherwise start two release jobs from the
# same base, both computing the same version. Serialise them.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      # A ruleset on `main` requires changes to go through a pull request, so the
      # default GITHUB_TOKEN cannot push here. The org-owned `yggdrasil-release`
      # GitHub App is on that ruleset's bypass list; mint a short-lived
      # installation token for it. The app is preferred over a PAT because it is
      # not tied to a person's account, so releases survive someone leaving.
      #
      # If this step fails: check the APP_ID variable and APP_PRIVATE_KEY secret.
      # If it succeeds and the *push* still fails, the app is missing from the
      # ruleset's bypass list (Settings → Rules → main protection → Bypass list →
      # Integrations).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Fetch full history to determine version bump and generate changelogs accurately
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Never cut a release from a tree that does not build and pass tests. Without
      # this the version commit and tag are created first and only the downstream
      # publish discovers the breakage — leaving main claiming a version that never
      # shipped.
      - name: Verify build and tests
        run: |
          npm run lint
          npm run format:check
          npm run compile
          xvfb-run -a npm test

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # With noBumpWhenEmptyChanges set in .versionrc.json, a push carrying only
      # hidden types (chore/docs/ci/test/style) produces no release at all. Compare
      # HEAD across the run to tell "released" from "nothing to do" — without this,
      # a no-op run would fall through and re-dispatch publish for the version that
      # is already live.
      - name: Run release
        id: release
        run: |
          before=$(git rev-parse HEAD)
          npm run release
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "No releasable changes since the last tag; skipping publish."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # --atomic is load-bearing: with --follow-tags alone, a rejected branch push
      # can still leave the tag on the remote, pointing at a commit that is on no
      # branch. That burns the version number and blocks the next release.
      - name: Push changes and tags
        if: steps.release.outputs.released == 'true'
        run: |
          git push origin main --follow-tags --atomic

      # The release commit carries [skip ci], which suppresses the tag-push trigger on
      # publish.yml, so the publish run has to be dispatched explicitly.
      - name: Dispatch publish workflow
        if: steps.release.outputs.released == 'true'
        run: gh workflow run publish.yml --ref "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env rather than interpolated straight into the run block:
          # the value derives from package.json, which is repo content.
          RELEASE_TAG: ${{ steps.release.outputs.value }}
